# Claude en CI · modo interactivo: responde a @claude en issues y pull requests · Unidad 6.
# Basado en el ejemplo oficial «Respond to @claude mentions» (code.claude.com/docs/en/github-actions).
# Requiere la Claude GitHub App instalada en el repo y el secreto CLAUDE_CODE_OAUTH_TOKEN
# (se genera con `claude setup-token` desde tu Claude Pro). El token NUNCA va en este archivo.
# Regla del curso: Claude diagnostica; tú corriges y haces merge con el CI en verde.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Solo corre si el comentario menciona @claude.
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude diagnostica y comenta; no edita el código.
          claude_args: '--max-turns 10 --disallowedTools "Edit,Write,NotebookEdit"'
